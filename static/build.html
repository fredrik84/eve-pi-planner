<!DOCTYPE html>
<!--
  Customer-facing build status page. Deliberately standalone: no app JS, no session, nothing that
  could pull in account data. It fetches exactly one public endpoint and renders what it returns.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Build status</title>
  <link rel="icon" href="/favicon.png?v=2">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <meta name="theme-color" content="#0d1017">
  <style>
    :root {
      --bg: #0d1017; --card: #12161f; --border: #1b2030; --text: #c8cdd8; --soft: #8a93a8;
      --accent: #a8c8ff; --green: #5ecf80; --amber: #e0b84a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
    .brand { font-size: 12px; color: var(--soft); letter-spacing: .08em; text-transform: uppercase; }
    h1 { font-size: 26px; margin: 6px 0 2px; font-weight: 600; }
    .for { color: var(--soft); font-size: 13px; margin-bottom: 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 18px; margin-bottom: 14px; }
    .headline { display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
      flex-wrap: wrap; margin-bottom: 12px; }
    .pct { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .state { font-size: 12px; padding: 3px 10px; border-radius: 10px; background: #1e2735; color: var(--soft); }
    .state.building { background: #1e3a5f; color: var(--accent); }
    .state.complete { background: #1b2a1e; color: var(--green); }
    .bar { height: 12px; border-radius: 6px; background: #1a1f2b; overflow: hidden; display: flex; }
    .bar i { display: block; height: 100%; }
    .bar .done { background: var(--green); }
    .bar .run { background: var(--accent); opacity: .55; }
    .eta { margin-top: 12px; font-size: 13px; color: var(--soft); }
    .eta b { color: var(--text); font-weight: 600; }
    .stages { margin-top: 4px; }
    .stage { border-top: 1px solid var(--border); padding: 12px 0; }
    .stage:first-child { border-top: 0; }
    .stage-hd { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
    .stage-nm { font-weight: 600; }
    .stage-nm .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #2c3444; margin-right: 8px; vertical-align: middle; }
    .stage.building .stage-nm .dot { background: var(--accent); }
    .stage.complete .stage-nm .dot { background: var(--green); }
    .stage-pct { font-size: 12px; color: var(--soft); font-variant-numeric: tabular-nums; }
    .stage .bar { height: 6px; margin-top: 8px; }
    .items { margin-top: 8px; font-size: 12px; color: var(--soft); line-height: 1.7; }
    .items span { display: inline-block; margin-right: 10px; }
    .items .ok { color: var(--green); }
    .items .now { color: var(--accent); }
    .foot { text-align: center; font-size: 11px; color: var(--soft); margin-top: 22px; line-height: 1.8; }
    .foot a { color: var(--soft); }
    .err { text-align: center; padding: 60px 20px; color: var(--soft); }
    @media (max-width: 520px) { .pct { font-size: 28px; } h1 { font-size: 21px; } }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="err">Loading…</div>
  </div>
<script>
const ID = (window.__BUILD_ID__ || location.pathname.split('/').pop() || '').trim();

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Hours → "3d 4h" / "5h 20m" / "40m". Customers read a duration, not a decimal.
function fmtHours(h) {
  if (h == null) return '—';
  if (h < 1) return `${Math.max(1, Math.round(h * 60))}m`;
  if (h < 24) { const w = Math.floor(h), m = Math.round((h - w) * 60);
    return m ? `${w}h ${m}m` : `${w}h`; }
  const d = Math.floor(h / 24), r = Math.round(h - d * 24);
  return r ? `${d}d ${r}h` : `${d}d`;
}

function fmtWhen(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  return d.toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit',
                                day: 'numeric', month: 'short' });
}

function barHtml(done, running, total) {
  const d = total ? Math.min(100, 100 * done / total) : 0;
  const r = total ? Math.min(100 - d, 100 * running / total) : 0;
  return `<div class="bar"><i class="done" style="width:${d}%"></i><i class="run" style="width:${r}%"></i></div>`;
}

function render(d) {
  const stages = (d.stages || []).map(s => {
    const items = (s.items || []).map(i =>
      `<span class="${i.done_runs >= i.runs ? 'ok' : i.running_runs ? 'now' : ''}">${esc(i.name)}</span>`).join('');
    return `<div class="stage ${s.state}">
      <div class="stage-hd">
        <span class="stage-nm"><span class="dot"></span>${esc(s.name)}</span>
        <span class="stage-pct">${s.state === 'complete' ? 'done'
          : s.running_runs ? `${s.pct}% · ${s.running_runs} job${s.running_runs > 1 ? 's' : ''} running`
          : `${s.pct}%`}</span>
      </div>
      ${barHtml(s.done_runs, s.running_runs, s.required_runs)}
      <div class="items">${items}</div>
    </div>`;
  }).join('');

  const stateLabel = d.status === 'complete' ? 'Ready' : d.status === 'building' ? 'In production' : 'Queued';
  const eta = d.status === 'complete'
    ? 'Finished — ready for handover.'
    : `<b>${fmtHours(d.eta_hours)}</b> to go${d.eta_at ? ` · expected ${esc(fmtWhen(d.eta_at))}` : ''}`;

  document.getElementById('app').innerHTML = `
    <div class="brand">Build status</div>
    <h1>${d.quantity}× ${esc(d.product)}</h1>
    <div class="for">${d.label ? 'For ' + esc(d.label) : '&nbsp;'}</div>
    <div class="card">
      <div class="headline">
        <span class="pct">${Math.round(d.pct)}%</span>
        <span class="state ${d.status}">${stateLabel}</span>
      </div>
      ${barHtml(d.jobs_done, (d.stages || []).reduce((a, s) => a + s.running_runs, 0), d.jobs_total)}
      <div class="eta">${eta}</div>
      ${d.current_stage ? `<div class="eta">Currently on <b>stage ${d.current_stage} of ${(d.stages || []).length}</b></div>` : ''}
    </div>
    <div class="card stages">${stages || '<div class="err">Nothing scheduled yet.</div>'}</div>
    <div class="foot">
      Updated ${esc(fmtWhen(d.updated_at))} · refreshes automatically<br>
      Built with <a href="/">EVE PI Planner</a>
    </div>`;
  document.title = `${Math.round(d.pct)}% — ${d.quantity}× ${d.product}`;
}

async function load() {
  try {
    const r = await fetch('/api/industry/build-status/' + encodeURIComponent(ID));
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      document.getElementById('app').innerHTML =
        `<div class="err">${esc(e.detail || 'This build link is no longer available.')}</div>`;
      return;
    }
    render(await r.json());
  } catch (e) {
    document.getElementById('app').innerHTML = '<div class="err">Could not load the build status.</div>';
  }
}

load();
// Jobs run for hours, so a slow poll is plenty — and the endpoint is cached for a minute anyway.
setInterval(load, 120000);
</script>
</body>
</html>
