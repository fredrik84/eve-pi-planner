name: Build and push image

on:
  push:
    branches: [main, dev]
    tags: ['v*']

# Serialize builds per ref (queue, don't cancel) so two close-together pushes can't race
# their push-to-:latest step out of order — the loser used to leave `:latest` pointing at
# an older commit than what actually landed last, and anything doing `updateStrategy: digest`
# (e.g. ArgoCD Image Updater) would then pin to that stale image.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Frontend guard, and it earns its place from one specific bug: a dead `if (!r.ok)` left behind by
  # the fetch()->api() migration referenced a variable that no longer existed, so every SUCCESSFUL
  # reaction assign threw, was caught, and was reported to the user as failed — and each retry
  # appended another set of rows (two suggestions became 27). Valid syntax, so `node --check` passes
  # it; only a run of that line fails. `no-undef` catches it and the tree is green today, so this is
  # purely preventive. See scripts/lint_js.mjs for why it is exactly one rule.
  lint-js:
    runs-on: ubuntu-latest
    # Reports, never blocks. The job already doesn't gate the deploy (`build` has no `needs:` on
    # it), but without this a transient npx / action-download hiccup still turns the whole RUN red
    # — and a red run that didn't fail the build is worse than no signal, because it trains you to
    # ignore the one that did. Seen for real on 2026-08-06, where this job's "Service Unavailable"
    # sat next to a `build` that had failed for an unrelated reason (no runner acquired), and the
    # lint noise was what got looked at first. The result still shows on the run, which is all the
    # `no-undef` guard was ever for.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check every frontend file
        run: for f in static/*.js; do node --check "$f"; done
      - name: no-undef
        run: node scripts/lint_js.mjs

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # write needed for `gh release create` on a tag push
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0      # full history + tags so the release step can diff against the previous tag

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Build a categorized changelog from the commit log, NOT --generate-notes: this repo ships
          # via direct pushes to main (no PRs), and --generate-notes itemizes merged PRs only, so it
          # produced an empty "What's Changed" + a bare compare link. Our conventional commit
          # messages ARE the release notes (see CONTRIBUTING), so group them by feat/fix/perf here.
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="${PREV}..${TAG}"; else RANGE="$TAG"; fi
          NOTES=$(mktemp)
          echo "## What's Changed in ${TAG}" >> "$NOTES"
          emit() {  # $1 = conventional-commit type, $2 = section heading
            body=$(git log "$RANGE" --no-merges --format='%s' | sed -n "s/^$1: /- /p" || true)
            if [ -n "$body" ]; then printf '\n### %s\n%s\n' "$2" "$body" >> "$NOTES"; fi
          }
          emit feat Features
          emit fix Fixes
          emit perf Performance
          # Everything else (refactor/test/chore/docs/…) keeps its type prefix under one heading.
          other=$(git log "$RANGE" --no-merges --format='%s' | grep -vE '^(feat|fix|perf): ' | sed 's/^/- /' || true)
          if [ -n "$other" ]; then printf '\n### Maintenance\n%s\n' "$other" >> "$NOTES"; fi
          if [ -n "$PREV" ]; then
            printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
              "${{ github.server_url }}" "${{ github.repository }}" "$PREV" "$TAG" >> "$NOTES"
          fi
          gh release create "$TAG" --title "$TAG" --notes-file "$NOTES"

      - name: Notify Discord
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          BODY=$(jq -n \
            --arg msg "$COMMIT_MSG" \
            --arg sha "$SHORT_SHA" \
            --arg ref "$REF_NAME" \
            '{
              username: "EVE PI Planner",
              embeds: [{
                title: ("Deploying (\($ref)) · \($sha)"),
                description: $msg,
                color: 3447003,
                footer: { text: "Image built — pod rolling in ~3 min" }
              }]
            }')
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$BODY" || true

      # The "Deploying" notification above only means the image was built and pushed — the
      # actual rollout is async from here (ArgoCD Image Updater polls every ~2min, commits to
      # evpi-gitops, ArgoCD syncs, pod rolls). This step polls the LIVE site's own build-time
      # GIT_COMMIT (exposed by /api/features, app/main.py GIT_COMMIT) until it matches this
      # build's SHA, so the "Deployed" notification reflects reality instead of firing at the
      # start and hoping. Only for branch pushes — tagging a release doesn't trigger a deploy.
      - name: Wait for rollout & notify Discord
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          if [ "$REF_NAME" = "main" ]; then
            SITE_URL="https://eveindustry.net"
          else
            SITE_URL="https://dev.eveindustry.net"
          fi
          DEPLOYED=""
          for i in $(seq 1 40); do        # 40 x 15s = up to 10 minutes
            LIVE_SHA=$(curl -s --max-time 10 "$SITE_URL/api/features" | jq -r '.git_commit // empty' || true)
            if [ "$LIVE_SHA" = "$COMMIT_SHA" ]; then
              DEPLOYED="1"
              break
            fi
            sleep 15
          done
          if [ "$DEPLOYED" = "1" ]; then
            TITLE="Deployed ($REF_NAME) · $SHORT_SHA"
            DESC="Live at $SITE_URL"
            COLOR=3066993   # green
          else
            TITLE="Deploy not confirmed ($REF_NAME) · $SHORT_SHA"
            DESC="$SITE_URL still wasn't serving this commit after 10 minutes — check ArgoCD."
            COLOR=15158332  # red
          fi
          BODY=$(jq -n --arg title "$TITLE" --arg desc "$DESC" --argjson color "$COLOR" \
            '{ username: "EVE PI Planner", embeds: [{ title: $title, description: $desc, color: $color }] }')
          curl -s -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$BODY" || true
